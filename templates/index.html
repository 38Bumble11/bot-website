<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>
    <style>
        :root {
            --bg-color: #313338;
            --panel-color: #2b2d31;
            --accent-color: #5865F2;
            --accent-hover: #4752C4;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .dashboard-container {
            background-color: var(--panel-color);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 450px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .status-badge {
            display: inline-block;
            background-color: #23a55a;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h1>Bot Dashboard</h1>
        <p>Manage and monitor your Discord bot status seamlessly.</p>
        
        <div>
            <span class="status-badge">● Bot Online</span>
        </div>

        <a href="#" class="btn">Configure Settings</a>
    </div>

</body>
</html>
