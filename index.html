<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Bot Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 50px; }
        .card { background: #1e1e1e; padding: 20px; margin: 20px auto; width: 300px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: inline-block; }
        h1 { color: #5865F2; }
        .stat { font-size: 28px; font-weight: bold; color: #2ecc71; }
    </style>
</head>
<body>
    <h1>🤖 Bot Dashboard</h1>
    <p>Welcome to your Discord server's live management panel.</p>
    
    <div class="card">
        <h3>Total Messages</h3>
        <div class="stat">{{ messages }}</div>
    </div>

    <div class="card">
        <h3>Total Warnings</h3>
        <div class="stat" style="color: #e67e22;">{{ warns }}</div>
    </div>
</body>
</html>
